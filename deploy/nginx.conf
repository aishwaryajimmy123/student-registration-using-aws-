# OPTIONAL PRODUCTION ENHANCEMENT — not required for the base project.
#
# Adds Nginx as a reverse proxy in front of Gunicorn:
#   Internet -> EC2:80 -> Nginx -> Gunicorn (127.0.0.1:8000) -> Flask
#
# If you use this, change deploy/flaskapp.service ExecStart to:
#   --bind 127.0.0.1:8000
# so Gunicorn only listens on localhost and Nginx is the sole public entry
# point on port 80.
#
# Install (Amazon Linux 2023):
#   sudo dnf install -y nginx
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/flaskapp.conf
#   sudo systemctl enable --now nginx

server {
    listen 80;
    server_name _;

    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
